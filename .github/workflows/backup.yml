name: Backup diário do banco (Supabase)

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC = 00:00 em Brasília
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # O apt padrão do Ubuntu instala um pg_dump mais antigo que o Postgres
      # 17 do Supabase; pg_dump se recusa a rodar contra servidor mais novo
      # que ele mesmo. Por isso instalamos direto do repositório oficial do
      # PostgreSQL (PGDG), pedindo a versão 17 explicitamente.
      - name: Instalar cliente PostgreSQL 17
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      # TEMPORÁRIO — remover depois de diagnosticar a falha de autenticação.
      # Não imprime a secret, só o tamanho e se o formato bate com o esperado.
      - name: Diagnóstico do secret (temporário)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "Tamanho da URL: ${#DATABASE_URL}"
          if [[ "$DATABASE_URL" =~ ^postgresql://postgres\.[a-zA-Z0-9]+:[^@]+@aws-0-sa-east-1\.pooler\.supabase\.com:5432/postgres$ ]]; then
            echo "Formato: OK"
          else
            echo "Formato: INESPERADO"
          fi

      - name: Gerar dump do banco
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" -Fc -f backup.dump

      # Repositório é público — o dump NUNCA pode subir sem criptografia,
      # senão dados de usuários reais ficam expostos no artifact.
      - name: Criptografar o dump
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in backup.dump \
            -out "backup-$(date -u +%Y-%m-%d).dump.enc" \
            -pass env:BACKUP_KEY
          rm backup.dump

      - name: Publicar backup criptografado
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backup-*.dump.enc
          retention-days: 90
